[package]
# The crate is `rmatrix-reloaded` because `rmatrix` on crates.io belongs to an
# unrelated project. Both the binary and the library keep the name `rmatrix`, so
# nothing about using it changes — only what you type to install it.
name = "rmatrix-reloaded"
version = "0.3.3"
edition = "2024"
description = "Digital rain for modern terminals"
license = "MIT"
repository = "https://github.com/Tripstack-Corp/rmatrix"
readme = "README.md"
keywords = ["matrix", "terminal", "tui", "screensaver", "cli"]
categories = ["command-line-utilities"]
# examples/perf.rs ships: the README tells people to run it to reproduce the
# performance numbers, and a claim you can't check is worth less.
# docs/ is excluded because it is several megabytes of demo video, which every
# `cargo install` would otherwise download. The README references it by absolute
# URL so it still renders on crates.io.
exclude = [".github/", "scripts/", "docs/"]

# Keeping the library named `rmatrix` means every `use rmatrix::...` in the
# binary, tests and examples stays as it is.
[lib]
name = "rmatrix"
path = "src/lib.rs"

[[bin]]
name = "rmatrix"
path = "src/bin/rmatrix/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
rand = "0.10.2"
thiserror = "2.0.19"

# "No unwrap or expect outside tests" was a rule enforced by review alone. This
# makes it a build failure instead. Denied here rather than in a lint attribute
# so it covers every target — library, binary, examples and tests — from one
# place. Exemptions: clippy.toml lets tests through, and the single sanctioned
# `expect` in writer.rs carries its own documented allow.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
