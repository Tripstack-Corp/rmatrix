name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Smoke-test the artifact we are about to publish, but only where the
      # runner can actually execute it — the x86_64 macOS build is cross-compiled
      # from arm64 and Rosetta is not guaranteed on the runner.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/rmatrix --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && version="${{ github.event.inputs.tag }}" && version="${version#v}"
          name="rmatrix-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/rmatrix" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Checksum the artifacts here, over the exact files being published, rather
      # than transporting per-target sums and rewriting their paths. Rewriting is
      # how the first attempt shipped a SHA256SUMS with a single space separator,
      # which no checksum tool will parse even though the hashes were right.
      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.tar.gz > SHA256SUMS
          # Fail loudly rather than publishing an unverifiable file again.
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # Published artifacts are immutable. This step used to end in
          # `|| gh release upload "$tag" dist/* --clobber`, which meant that
          # re-running the workflow against an existing tag silently replaced
          # the binaries *and* SHA256SUMS underneath anyone who had already
          # downloaded and verified them. A release that has assets is
          # finished; the only correct move is to bump the tag.
          if assets=$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null); then
            if [ "$assets" -ne 0 ]; then
              echo "::error::release $tag already has $assets asset(s); published artifacts are immutable, so bump the version and tag again rather than replacing them"
              exit 1
            fi
            # Created but empty: `gh release create` made the release and then
            # died before the upload finished. Filling it in is not a rewrite.
            echo "release $tag exists with no assets; completing the upload"
            gh release upload "$tag" dist/*
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              dist/*
          fi
